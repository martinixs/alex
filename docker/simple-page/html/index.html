
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — ЕРУФР</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="page-wrapper">

    <!-- Левая часть -->
    <div class="left-side">
        <div class="brand">
            <div class="logo-box"></div>
            <span class="logo-text">ЕРУФР</span>
        </div>
        <div class="org-name">Единый реестр<br>участников<br>финансового рынка</div>
        <div class="divider"></div>
        <div class="portal-name">Портал бизнес-пользователей</div>
        <div class="portal-desc">Централизованная система управления данными участников финансового рынка</div>
    </div>

    <!-- Правая часть — карточка входа -->
    <div class="right-side">
        <div class="login-card">

            <div class="login-card-accent"></div>

            <div class="login-card-body">
                <div class="login-title">Вход в систему</div>
                <div class="login-subtitle">Введите учётные данные для доступа</div>

                <form onsubmit="handleLogin(event)">

                    <div class="form-group">
                        <label for="login">Логин</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <input type="text" id="login" placeholder="Введите логин" autocomplete="username"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="password" placeholder="Введите пароль" autocomplete="current-password"/>
                        </div>
                    </div>

                    <div class="form-bottom-row">
                        <label class="remember-label">
                            <input type="checkbox" class="remember-check"/>
                            <span>Запомнить меня</span>
                        </label>
                        <a href="#" class="forgot-link">Забыли пароль?</a>
                    </div>

                    <button type="submit" class="btn-login">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" y1="12" x2="3" y2="12"/>
                        </svg>
                        Войти
                    </button>

                </form>

                <div class="login-footer">
                    © 2025 ЕРУФР. Все права защищены.
                </div>
            </div>

        </div>
    </div>

</div>

<script src="index.js"></script>
</body>
</html>
